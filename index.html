<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b7f4b">
  <title>Pont du terroir</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="entete">
    <h1>Pont du terroir</h1>
    <p class="sous-titre">Phrases courantes · Français · English · Moundang</p>
  </header>

  <main>
    <section class="langues" aria-label="Choix des langues">
      <div class="champ">
        <label for="langue-source">Je parle</label>
        <select id="langue-source"></select>
      </div>

      <button id="inverser" class="inverser" type="button" aria-label="Inverser les langues">⇄</button>

      <div class="champ">
        <label for="langue-cible">Je veux dire en</label>
        <select id="langue-cible"></select>
      </div>
    </section>

    <div class="taille" aria-label="Taille du texte">
      <button id="plus-petit" type="button" aria-label="Réduire le texte">A−</button>
      <button id="plus-grand" type="button" aria-label="Agrandir le texte">A+</button>
    </div>

    <section class="recherche">
      <input id="recherche" type="search" placeholder="Rechercher une phrase…" aria-label="Rechercher une phrase">
    </section>

    <section id="contenu" aria-live="polite"></section>
  </main>

  <footer class="pied">
    <p>Projet en cours · langue de départ : moundang</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
